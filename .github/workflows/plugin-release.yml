# Publish the JobPilot plugin: a tarball asset (downloaded by the terminal host
# at runtime) plus a vendored sync into the claude-plugins marketplace.
# Trigger by pushing a tag like `plugin/v2.1.0`, or run manually to re-sync.
#
# Requires repo secret MARKETPLACE_PUSH_TOKEN: a fine-grained PAT with
# Contents: read/write on suxrobGM/claude-plugins.
name: Release Plugin

on:
  push:
    tags:
      - "plugin/v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Archive the plugin/ contents (not the plugin/ dir itself), so the host
      # extracts straight into its active plugin directory.
      - name: Package plugin
        run: tar -czf jobpilot-plugin.tar.gz -C plugin .

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/plugin/v')
        uses: softprops/action-gh-release@v3
        with:
          files: jobpilot-plugin.tar.gz
          generate_release_notes: true

      - name: Checkout marketplace
        uses: actions/checkout@v7
        with:
          repository: suxrobGM/claude-plugins
          token: ${{ secrets.MARKETPLACE_PUSH_TOKEN }}
          path: marketplace

      # Mirror plugin/ into the vendored marketplace copy and commit if changed.
      - name: Sync to marketplace
        run: |
          rsync -a --delete plugin/ marketplace/plugins/jobpilot/
          cd marketplace
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: sync jobpilot plugin ${GITHUB_REF_NAME}"
          git push

# One release for host + plugin. Push a tag like `v2.1.0` (or run manually to re-sync): builds the AOT
# host per OS, publishes the Release (terminal archives + plugin tarball), and mirrors plugin/ into the
# claude-plugins marketplace. Needs secret MARKETPLACE_PUSH_TOKEN (Contents:write on suxrobGM/claude-plugins).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish AOT
        run: dotnet publish -c Release -r ${{ matrix.rid }} -o publish/
        working-directory: apps/terminal

      # The publish dir contains the native binary AND the bundled plugin/ tree,
      # so archive the whole directory, not just the binary.
      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: tar -czf jobpilot-terminal-${{ matrix.rid }}.tar.gz -C apps/terminal/publish .

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path apps/terminal/publish/* -DestinationPath jobpilot-terminal-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobpilot-terminal-${{ matrix.rid }}
          path: jobpilot-terminal-${{ matrix.rid }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download terminal artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Package the plugin/ contents (not the plugin/ dir itself) so the host
      # extracts straight into its active plugin directory.
      - name: Package plugin
        run: tar -czf jobpilot-plugin.tar.gz -C plugin .

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*/jobpilot-terminal-*
            jobpilot-plugin.tar.gz
          generate_release_notes: true

      - name: Checkout marketplace
        uses: actions/checkout@v7
        with:
          repository: suxrobGM/claude-plugins
          token: ${{ secrets.MARKETPLACE_PUSH_TOKEN }}
          path: marketplace

      # Mirror plugin/ into the vendored marketplace copy and commit if changed.
      - name: Sync to marketplace
        run: |
          rsync -a --delete plugin/ marketplace/plugins/jobpilot/
          cd marketplace
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: sync jobpilot plugin ${GITHUB_REF_NAME}"
          git push

# Deploy the API first, then build and deploy web: the web build prerenders pages from the live
# API, so building web against the previous API release breaks on any response-shape change.

name: Build and Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  api:
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: api
    secrets: inherit
    permissions:
      contents: read
      packages: write

  web:
    needs: api
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: web
    secrets: inherit
    permissions:
      contents: read
      packages: write

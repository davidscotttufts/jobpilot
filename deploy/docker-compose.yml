# Production stack pulled from GHCR. Postgres is external (DATABASE_URL in .env).
# GITHUB_REPOSITORY (lowercased owner/repo) comes from .env, written by the deploy workflow.
services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY}/api:latest
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=4101
    ports:
      - "127.0.0.1:${API_PORT:-4101}:4101"
    volumes:
      - api-storage:/app/apps/api/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4101/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    image: ghcr.io/${GITHUB_REPOSITORY}/web:latest
    environment:
      - NODE_ENV=production
      - PORT=4100
      - HOSTNAME=0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-4100}:4100"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4100"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  api-storage:
